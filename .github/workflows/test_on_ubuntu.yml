name: test on ubuntu

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: cmake src
        run: cmake -B build -C cmake/gnu-release.cmake
      - name: build src
        run: cmake --build build --parallel
      - name: install
        run: cmake --install build
      - name: cmake test
        run: cd sample/test && cmake -B build -C ../../cmake/gnu-release.cmake
      - name: build test
        run: cd sample/test && cmake --build build --parallel
      - name: run test
        run: cd sample/test && ./test.out
